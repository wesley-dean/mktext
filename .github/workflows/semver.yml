---
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  workflow_dispatch:

name: Versioning
permissions:
  contents: read

concurrency:
  group: "${{ github.ref }}-${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  versioning:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats curl shellcheck

      - name: Prepare and verify build dependencies
        run: |
          make deps
          make deps-check

      - name: Validate distribution pipeline before versioning
        run: make check test VERSION=0.0.0-ci

      - name: calculate version
        id: calculate-version
        uses: bitshifted/git-auto-semver@c4e8f005e839f822325356f141939cf6c76b5701 # pin@v1
        with:
          create_tag: true
          initial_version: 0.0.1
          tag_prefix: v

      - name: Verify prepared dependencies before release build
        run: make deps-check

      - name: Build release artifacts
        run: make build VERSION="${{ steps.calculate-version.outputs.version-string }}"

      - name: Validate release artifacts
        run: make test-generated VERSION="${{ steps.calculate-version.outputs.version-string }}"

      - name: Generate release notes
        id: release-notes
        uses: RedCrafter07/release-notes-action@31674bfa3a219e7c661fc0c5b7b3851c741b9965 # pin@v1.0.1
        with:
          tag-name: "v${{ steps.calculate-version.outputs.version-string }}"
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Create release
        id: create-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # pin@v3.0.2
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          name: "v${{ steps.calculate-version.outputs.version-string }}"
          body: "${{ steps.release-notes.outputs.release-notes }}"
          tag_name: "v${{ steps.calculate-version.outputs.version-string }}"
          draft: false
          prerelease: false
          files: |
            dist/mktext.dev.bash
            dist/mktext.dev.bash.sha256
            dist/mktext.bash
            dist/mktext.bash.sha256
            dist/mktext.min.bash
            dist/mktext.min.bash.sha256
